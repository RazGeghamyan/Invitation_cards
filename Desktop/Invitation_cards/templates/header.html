<style>
    /* Ապահովում է, որ էկրանից դուրս տարրեր չլինեն և չհայտնվի հորիզոնական scroll */
    html, body {
        overflow-x: hidden;
        margin: 0;
        padding: 0;
    }
</style>

<header
    class="fixed top-[15px] left-1/2 -translate-x-1/2 w-[94%] max-w-[1200px] bg-[#333333] rounded-[50px]
           px-[15px] sm:px-[25px] py-[10px] z-[1000] shadow-[0_10px_30px_rgba(0,0,0,0.1)]
           transition-all duration-300"
>
    <div class="flex justify-between items-center">

        <div class="flex items-center shrink-0">
    <a href="/" class="flex items-center group">
        <img src="ձեր-նկարի-հասցեն.png" alt="Naiva Logo"
             class="h-[50px] w-auto brightness-0 invert transition-all duration-300 group-hover:scale-105"
        >

        <div class="flex flex-col ml-3">
                    <span class="text-[#7D936C] font-bold tracking-[1px] whitespace-nowrap"
                          style="font-size: clamp(14px, 4vw, 18px);">
                        HARSANYAC
                    </span>
                    <small class="text-[8px] tracking-[1.5px] text-[#ccc] uppercase mt-[-2px]">
                        Premium Invitations
                    </small>
                </div>
            </a>
        </div>

        <button
            id="menu-btn"
            onclick="toggleMenu()"
            class="flex flex-col justify-between w-[22px] h-[16px] bg-transparent border-none cursor-pointer p-0 z-[1100] min-[992px]:hidden group"
        >
            <span class="w-full h-[2px] bg-[#7D936C] transition-all duration-300 origin-center"></span>
            <span class="w-full h-[2px] bg-[#7D936C] transition-all duration-300"></span>
            <span class="w-full h-[2px] bg-[#7D936C] transition-all duration-300 origin-center"></span>
        </button>

        <nav
            id="main-nav"
            class="
                /* Mobile Styles */
                fixed top-0 -right-[110%] w-[75%] max-w-[280px] h-screen bg-[#333333]
                pt-[100px] px-[30px] pb-[30px] rounded-l-[30px] shadow-[-10px_0_30px_rgba(0,0,0,0.3)] z-[1050]
                transition-all duration-700 ease-[cubic-bezier(0.2,1,0.3,1)]

                /* Desktop Styles */
                min-[992px]:static min-[992px]:block min-[992px]:w-auto min-[992px]:max-w-none min-[992px]:h-auto
                min-[992px]:bg-transparent min-[992px]:p-0 min-[992px]:shadow-none min-[992px]:rounded-none
            "
        >
            <ul class="flex flex-col gap-[25px] list-none min-[992px]:flex-row min-[992px]:gap-[25px]">
                <li>
                    <a href="/" class="text-white no-underline text-[15px] uppercase tracking-[1px] hover:text-[#7D936C] transition-colors">
                        Գլխավոր
                    </a>
                </li>
                <li>
                    <a href="/catalog" class="text-white no-underline text-[15px] uppercase tracking-[1px] hover:text-[#7D936C] transition-colors">
                        Հրավիրատոմսեր
                    </a>
                </li>
                <li>
                    <a href="/#how-to-order" class="text-white no-underline text-[15px] uppercase tracking-[1px] hover:text-[#7D936C] transition-colors">
                        Ինչպես պատվիրել
                    </a>
                </li>
                <li>
                    <a href="/#about" class="text-white no-underline text-[15px] uppercase tracking-[1px] hover:text-[#7D936C] transition-colors">
                        Մեր Մասին
                    </a>
                </li>

                <li class="block min-[992px]:hidden mt-[10px]">
                    <a href="tel:+37400000000" class="inline-block bg-[#7D936C] text-white py-[12px] px-[20px] rounded-[25px] text-[14px] text-center w-full shadow-lg">
                        📞 099 00 00 00
                    </a>
                </li>
            </ul>
        </nav>

        <div class="hidden min-[992px]:block">
            <a href="tel:+37400000000" class="flex items-center bg-[#7D936C] py-[8px] px-[20px] rounded-[25px] text-white text-[13px] font-medium transition-all duration-300 hover:brightness-110 hover:scale-105">
                📞 <span class="ml-2">099 00 00 00</span>
            </a>
        </div>

    </div>
</header>

<script>
    function toggleMenu() {
        const nav = document.getElementById('main-nav');
        const btn = document.getElementById('menu-btn');
        const spans = btn.getElementsByTagName('span');

        if (nav.classList.contains('!right-0')) {
            nav.classList.remove('!right-0');
            // Reset Hamburger Icon
            spans[0].classList.remove('rotate-45', 'translate-y-[7px]');
            spans[1].classList.remove('opacity-0');
            spans[2].classList.remove('-rotate-45', '-translate-y-[7px]');
        } else {
            nav.classList.add('!right-0');
            // Animate Hamburger Icon to X
            spans[0].classList.add('rotate-45', 'translate-y-[7px]');
            spans[1].classList.add('opacity-0');
            spans[2].classList.add('-rotate-45', '-translate-y-[7px]');
        }
    }

    // Փակել մենյուն, երբ սեղմում ենք որևէ լինկի վրա (մոբայլում)
    document.querySelectorAll('#main-nav a').forEach(link => {
        link.addEventListener('click', () => {
            const nav = document.getElementById('main-nav');
            if (nav.classList.contains('!right-0')) {
                toggleMenu();
            }
        });
    });
</script>
